<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBER CASE VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CYBER CASE VR: a one-room cybercrime investigation game for Meta Quest (WebXR) and desktop browsers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: full-bleed WebGL scene; the title is a start-aligned dossier column over a scrim; the HUD is a compact start-corner card. One committed dark look. */
:root {
  --ink: #02060c;
  --navy: #061223;
  --panel: rgba(5, 14, 27, 0.9);
  --line: #1a3a55;
  --cyan: #3ee8ff;
  --violet: #c070ff;
  --green: #3dffa8;
  --amber: #ffc247;
  --red: #ff4766;
  --text: #e4f3f8;
  --muted: #87a3b6;
  --f-disp: "Chakra Petch", "Noto Kufi Arabic", "Segoe UI", sans-serif;
  --f-ar: "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

/* ---------- title ---------- */
#title { position: fixed; inset: 0; z-index: 10; overflow-y: auto;
  background: linear-gradient(to var(--scrim-dir, left), rgba(2,6,12,0.97) 0%, rgba(2,6,12,0.9) 44%, rgba(2,6,12,0.25) 100%);
  padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 28px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
html[dir="ltr"] #title { --scrim-dir: right; }
.dossier { max-width: 600px; margin-inline-start: clamp(0px, 5vw, 72px); display: flex; flex-direction: column; gap: 20px; }
.classif { display: flex; flex-wrap: wrap; gap: 8px 14px; font: 700 12px/1.4 var(--f-mono); letter-spacing: 0.16em; color: var(--muted); direction: ltr; justify-content: flex-start; }
html[dir="rtl"] .classif { justify-content: flex-end; }
.classif b { color: var(--ink); background: var(--amber); padding: 2px 8px; letter-spacing: 0.14em; }
.brand { margin: 0; direction: ltr; text-align: start; font: 700 clamp(54px, 11vw, 104px)/0.86 var(--f-disp); letter-spacing: 0.02em; text-transform: uppercase; }
html[dir="rtl"] .brand { text-align: right; }
.brand span { display: block; }
.brand .vr { color: var(--cyan); font-size: 0.58em; letter-spacing: 0.32em; margin-top: 10px; }
.brand-ar { margin: -6px 0 0; font: 700 clamp(22px, 4vw, 30px)/1.3 var(--f-ar); color: var(--green); }
.story { margin: 0; font-size: 17px; line-height: 1.85; max-width: 60ch; color: #cfe2ea; text-wrap: pretty; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 600 13px var(--f-body); color: var(--muted); letter-spacing: 0.04em; }
.field input { background: rgba(9, 24, 42, 0.9); border: 1px solid var(--line); color: var(--text); padding: 12px 14px; border-radius: 6px; font: 700 18px var(--f-mono); max-width: 320px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: rgba(9, 24, 42, 0.92); color: var(--text); padding: 15px 18px; border-radius: 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: start; font-weight: 700; font-size: 17px; transition: border-color .15s, background .15s; }
.btn small { font: 400 11px var(--f-mono); letter-spacing: 0.14em; color: var(--muted); direction: ltr; }
.btn:hover:not(:disabled) { border-color: var(--cyan); background: rgba(62, 232, 255, 0.1); }
.btn.primary { background: var(--cyan); color: var(--ink); border-color: var(--cyan); }
.btn.primary small { color: rgba(2, 6, 12, 0.65); }
.btn.primary:hover:not(:disabled) { background: #8ff3ff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.wide { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
.note { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); min-height: 1.7em; }
.note.warn { color: var(--amber); }
.meta { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
.meta .prog { font: 700 14px var(--f-mono); color: var(--green); direction: ltr; text-align: start; unicode-bidi: plaintext; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; align-self: flex-start; font-size: 13px; }
.linkish:hover { color: var(--red); }

/* ---------- desktop HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#card { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); inset-inline-start: max(14px, env(safe-area-inset-left, 0px));
  width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(4px); }
#card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#c-title { font: 700 16px var(--f-body); }
#c-time { font: 700 22px var(--f-mono); color: var(--amber); font-variant-numeric: tabular-nums; }
#c-time.low { color: var(--red); }
#c-score { font: 700 14px var(--f-mono); color: var(--green); }
#c-combo { font: 700 13px var(--f-mono); color: var(--amber); }
.sev { font: 700 12px var(--f-body); padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); }
.sev:empty { display: none; }
.sev.s0 { color: var(--green); border-color: var(--green); }
.sev.s1 { color: var(--amber); border-color: var(--amber); }
.sev.s2, .sev.s3 { color: var(--red); border-color: var(--red); }
#c-obj { white-space: pre-line; font-size: 13.5px; line-height: 1.65; color: var(--text); }
#c-health { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
#c-health span { display: block; height: 100%; border-radius: 99px; transition: width .3s; }
#c-health .ok { background: var(--green); } #c-health .mid { background: var(--amber); } #c-health .low { background: var(--red); }
#b-hint { pointer-events: auto; align-self: flex-start; background: rgba(255,194,71,0.1); color: var(--amber); border: 1px solid var(--amber); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 700; font-size: 13px; }
#b-hint:hover { background: rgba(255,194,71,0.22); }
#keys { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); inset-inline-start: max(14px, env(safe-area-inset-left, 0px)); font: 400 12px var(--f-body); color: var(--muted); background: rgba(2,6,12,0.6); padding: 6px 10px; border-radius: 6px; max-width: calc(100vw - 120px); }
#b-pause { pointer-events: auto; position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); inset-inline-end: max(14px, env(safe-area-inset-right, 0px));
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
#b-pause:hover { border-color: var(--cyan); }
#cross { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; z-index: 6; display: none; }
#cross.on { display: block; }
#cross::before, #cross::after { content: ""; position: absolute; background: var(--cyan); }
#cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
#cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
#prompt { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); transform: translateX(-50%); z-index: 6; pointer-events: none;
  background: rgba(2,6,12,0.86); border: 1px solid var(--cyan); color: var(--text); padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 15px; max-width: calc(100vw - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toasts { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); left: 50%; transform: translateX(-50%); z-index: 7; display: flex; flex-direction: column-reverse; gap: 8px; align-items: center; pointer-events: none; width: min(560px, calc(100vw - 32px)); }
.toast { background: rgba(3,10,20,0.94); border: 1px solid var(--cyan); border-inline-start-width: 4px; padding: 10px 14px; border-radius: 6px; font-size: 14.5px; line-height: 1.6; width: 100%; box-sizing: border-box; animation: tin .22s ease-out; transition: opacity .35s, transform .35s; }
.toast.good { border-color: var(--green); }
.toast.bad { border-color: var(--red); }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
@media (max-width: 720px) {
  #card { width: min(300px, calc(100vw - 110px)); padding: 10px 12px; }
  #c-obj { font-size: 12.5px; }
  .actions { grid-template-columns: 1fr; }
}
@media (max-width: 720px), (pointer: coarse) { #keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; transition: none; } .btn { transition: none; } }
</style>

<body>
<div id="app" aria-label="CYBER CASE VR 3D scene"></div>

<section id="title" aria-labelledby="brand">
  <div class="dossier">
    <div class="classif"><b>CASE 0417</b><span>CRIME SCENE</span><span>DO NOT CROSS</span></div>
    <h1 class="brand" id="brand"><span>Cyber</span><span>Case</span><span class="vr">VR</span></h1>
    <p class="brand-ar">قضية المخترق «صقر» · تحقيق في غرفة واحدة</p>
    <p class="story" data-t="storyIntro"></p>
    <div class="field">

    </div>
    <div class="actions">
      <button class="btn primary" id="b-vr" type="button"><span data-t="enterVR"></span><small>IMMERSIVE VR · WEBXR</small></button>
      <button class="btn" id="b-desk" type="button"><span data-t="playDesktop"></span><small>KEYBOARD · MOUSE · TOUCH</small></button>

      <span class="prog" id="progress"></span>
      <span data-t="controlsDesk"></span>
      <span data-t="controlsVR"></span>
      <button class="linkish" id="b-reset" type="button" data-t="resetProgress"></button>
    </div>
  </div>
</section>

<div id="hud" hidden>

    <div class="row"><span id="c-title"></span><span id="c-time"></span></div>
    <div class="row"><span id="c-score"></span></div>
    <div id="c-health" hidden><span id="c-bar" class="ok"></span></div>
    <div id="c-obj"></div>

  <button id="b-pause" type="button" data-t="pauseBtn"></button>
  <div id="keys" data-t="controlsDesk"></div>
</div>
<div id="cross"></div>
<div id="prompt" hidden></div>
<div id="toasts" aria-live="polite"></div>

</body>
